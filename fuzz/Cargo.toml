[package]
name = "clam-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `net` liga o link, o único alvo que precisa de rede; o resto do `clam` compila igual.
clam = { path = "..", features = ["net"] }
arbitrary = { version = "1", features = ["derive"] }
snow = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }

[workspace]

[[bin]]
name = "cell"
path = "fuzz_targets/cell.rs"
test = false
doc = false
bench = false

[[bin]]
name = "descriptor"
path = "fuzz_targets/descriptor.rs"
test = false
doc = false
bench = false

