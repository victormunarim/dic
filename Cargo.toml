[package]
name = "clam"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10"
cpal = { version = "0.18", optional = true }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"], optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
snow = { version = "0.10.0", optional = true }
futures = { version = "0.3.34", optional = true }
hkdf = "0.12"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"], optional = true }
hmac = "0.12"
libp2p = { version = "0.57.1", features = ["tokio", "tcp", "noise", "yamux", "kad", "gossipsub", "macros", "identify"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"], optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }
igd-next = { version = "0.18.0", features = ["aio_tokio"], optional = true }
sonora = { version = "0.2.0", optional = true }
openh264 = { version = "0.9.9", optional = true }
openh264-sys2 = { version = "0.9.9", optional = true }
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
x11rb = { version = "0.14.0", optional = true }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"], optional = true }
rustix = { version = "1", default-features = false, features = ["std"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"], optional = true }

[features]
gui = ["net", "capture", "portal", "dep:eframe", "dep:keyring", "dep:nnnoiseless"]
audio = ["dep:cpal", "dep:sonora"]
net = ["dep:igd-next", "dep:libp2p", "dep:tokio", "dep:futures", "dep:snow"]
video = ["net", "dep:openh264", "dep:openh264-sys2"]
capture = ["video", "dep:x11rb", "dep:windows-sys"]
portal = ["video", "dep:ashpd", "dep:rustix"]

[dev-dependencies]
libp2p = "0.57"
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros", "time", "sync", "net", "io-util"] }

[[example]]
name = "gui"
path = "examples/gui/main.rs"
test = true
required-features = ["gui"]

[[example]]
name = "measure"
required-features = ["net"]

[[example]]
name = "call"
required-features = ["net"]

[[example]]
name = "directory"
required-features = ["net"]
